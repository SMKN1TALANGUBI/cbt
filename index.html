<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Ujian Online</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f8fafc; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>
    <!-- CATATAN: Atribut 'sandbox' telah dihapus untuk menghindari bentrok redirect yang menyebabkan Error 404. Izin diletakkan di atribut 'allow'. -->
    <iframe 
        src="[https://script.google.com/macros/s/AKfycbyhUv76J9VibzFsDsAUut3OH95Uc2-0TFQ1hx-kRU4IWTzk81_05tW8k1UIcmD7TgPb/exec](https://script.google.com/macros/s/AKfycbyhUv76J9VibzFsDsAUut3OH95Uc2-0TFQ1hx-kRU4IWTzk81_05tW8k1UIcmD7TgPb/exec)" 
        allow="downloads; geolocation; camera; microphone; fullscreen; clipboard-read; clipboard-write">
    </iframe>
</body>
</html>
